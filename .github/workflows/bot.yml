name: Auto TelePet 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout ma nguon
        uses: actions/checkout@v4

      - name: Cai dat Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cai dat thu vien
        run: |
          python -m pip install --upgrade pip
          pip install requests telethon colorama

      - name: Chay Bot (Neu dung thi 1 phut sau tu dong bat lai)
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          while true; do
            python auto_kiemtien.py
            echo "Code vua tat, cho dung 60 giay roi tu dong bat lai..."
            sleep 60
          done
