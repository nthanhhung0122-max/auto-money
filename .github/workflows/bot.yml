name: Auto Nhiem Vu TelePet 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '10 17 * * *'  # 00:10 GMT+7 mỗi ngày
  workflow_run:
    workflows: ["Auto Nhiem Vu TelePet 24/7"]
    types: [completed]

jobs:
  run-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Nghi 1 phut neu duoc bat lai
        if: github.event_name == 'workflow_run'
        run: |
          echo "Nghi 60 giay truoc khi chay..."
          sleep 60

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests telethon colorama

      - name: Chay Bot Nhiem Vu
        run: |
          python auto_kiemtien.py
