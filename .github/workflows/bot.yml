name: Auto Money Bot

on:
  schedule:
    # Lịch chạy tự động: Cứ mỗi 15 phút bot sẽ tự động chạy 1 lần
    - cron: '*/15 * * * *'
  
  # Cho phép bạn bấm nút chạy thủ công bất cứ lúc nào trên web GitHub
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run script
        run: python auto_kiemtien.py
